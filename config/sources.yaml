sources:
- name: shop_a
  type: json
  currency_unit: toman
  priority: 10
  min_expected_products: 3
  path: fixtures/shop_a.json
  items_path: data.products
  base_url: https://shop-a.example
  fields:
    id: id
    title: name
    price: price
    stock: available
    url: link
    color: color
    barcode: barcode
- name: shop_b
  type: html
  currency_unit: rial
  priority: 20
  min_expected_products: 3
  path: fixtures/shop_b.html
  base_url: https://shop-b.example
  item_selector: div.p
  out_of_stock_selector: .soldout
  fields:
    id: '@attr(data-id)'
    title: .t
    price: .price
    url: .t::attr(href)
- name: shop_c
  type: csv
  currency_unit: toman
  priority: 30
  min_expected_products: 3
  path: fixtures/shop_c.csv
  columns:
    id: sku
    title: title
    price: price
    stock: stock
    url: link
- name: farnaa
  type: farnaa
  currency_unit: toman
  priority: 30
  min_expected_products: 30
  degraded_excluded: true
  url: https://farnaa.com/category/mobile?availablestock=true
  base_url: https://farnaa.com/
  rate_limit_per_sec: 0.5
  timeout: 30
  retries: 3
  in_stock_values:
  - in stock
  out_of_stock_values:
  - out of stock
- name: exontel
  type: exontel
  currency_unit: toman
  priority: 40
  min_expected_products: 20
  degraded_excluded: true
  url: https://exontel.com/category/phones?available=true
  base_url: https://exontel.com/
  rate_limit_per_sec: 0.5
  timeout: 30
  retries: 3
  page_timeout_ms: 90000
  max_scrolls: 30
  stable_scrolls: 3
  max_products: 1000
- name: kasrapars
  type: kasrapars
  currency_unit: toman
  priority: 50
  min_expected_products: 3
  degraded_excluded: true
  base_url: https://plus.kasrapars.ir/
  rate_limit_per_sec: 0.5
  timeout: 30
  retries: 3
  max_pages: 100
  follow_next: true
  page_query_fallback: false
  pagination_param: page
  path: fixtures/kasrapars_mobile.html
