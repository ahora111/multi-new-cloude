sources:
- name: shop_a
  type: json
  currency_unit: toman
  priority: 10
  min_expected_products: 5
  path: fixtures/shop_a.json
  items_path: data.products
  base_url: https://shop-a.example
  fields:
    id: id
    title: name
    price: price
    stock: available
    url: link
    color: color
    barcode: barcode
- name: shop_b
  type: html
  currency_unit: rial
  priority: 20
  min_expected_products: 5
  path: fixtures/shop_b.html
  base_url: https://shop-b.example
  item_selector: div.p
  out_of_stock_selector: .soldout
  fields:
    id: '@attr(data-id)'
    title: .t
    price: .price
    url: .t::attr(href)
- name: shop_c
  type: csv
  currency_unit: toman
  priority: 30
  min_expected_products: 5
  path: fixtures/shop_c.csv
  columns:
    id: sku
    title: title
    price: price
    stock: stock
    url: link
- name: farnaa
  type: farnaa
  currency_unit: toman
  priority: 30
  min_expected_products: 50
  degraded_excluded: true
  url: https://farnaa.com/category/mobile
  base_url: https://farnaa.com/
  rate_limit_per_sec: 0.5
  timeout: 30
  retries: 3
