match_auto_threshold: 95
match_review_threshold: 85
review_as_match: false
max_price_age_minutes: 180
outlier_ratio: 3.0
history_alert_pct: 15
output_dir: data/real/out
history_file: data/real/history.jsonl
cache_dir: data/real/cache
lock_file: data/real/run.lock
telegram_enabled: true       # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (see docs/GO_LIVE_FA.md)
telegram_dry_run: false
telegram_only_on_change: true
telegram_min_change_pct: 0.5
telegram_state_file: data/real/telegram_state.json
telegram_group_by: brand          # brand | product | none  -> one post per brand / per phone / one long post
telegram_mode: full              # full = every phone each time | changes_only = only the colours whose price moved
telegram_show_links: true
telegram_max_messages: 60
